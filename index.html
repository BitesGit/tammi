<!doctype html><html lang="fi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tammi</title><style>*{box-sizing:border-box}body{margin:0;background:#202520;color:#fff;font:16px system-ui;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}h1{margin:0;font-size:24px}header{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}button,select{font:inherit;padding:8px;border-radius:8px;border:0;cursor:pointer}#board{width:min(94vw,calc(100dvh - 155px));aspect-ratio:1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border:5px solid #60432e;box-shadow:0 8px 30px #0008} .sq{border-radius:0;padding:0;display:grid;place-items:center;position:relative;min-width:0;min-height:0;overflow:hidden}.light{background:#ead7b5}.dark{background:#956440}.selected{background:#d5ad43}.piece{width:62%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(14px,4vmin,40px);box-shadow:0 3px 4px #0007,inset 0 0 0 4px #8885;border:2px solid #0005}.white{background:#f5e5c3;color:#8a5d20}.black{background:#292929;color:#edbd55}.dot{width:24%;aspect-ratio:1;border-radius:50%;background:#f8d65b}#status{font-weight:bold;text-align:center}.piece{position:relative;border:1px solid #42250f;box-shadow:0 4px 0 #49301c,0 6px 6px #0006,inset 0 0 0 3px #ffffff20,inset 0 0 0 5px #0002;text-shadow:0 1px 2px #0008}.white{background:repeating-linear-gradient(8deg,#ffffff00 0px,#ffffff00 3px,#8b53221c 4px,#ffffff00 7px),radial-gradient(ellipse at 25% 20%,#f7deb0,#d2a36b 80%);color:#79501f;border-color:#a47843;box-shadow:0 4px 0 #a47743,0 6px 6px #0006,inset 0 0 0 3px #fff3,inset 0 0 0 5px #80502030}.black{background:repeating-linear-gradient(8deg,#ffffff00 0px,#ffffff00 3px,#e6b17b20 4px,#ffffff00 7px),radial-gradient(ellipse at 25% 20%,#80563b,#3b2116 85%);color:#f3d49a}dialog{background:#30372e;color:white;border:1px solid #aaa;border-radius:12px;max-width:95vw}dialog label{display:flex;justify-content:space-between;gap:16px;margin:12px 0}.taken{opacity:.3}
html{color-scheme:dark;overscroll-behavior:none}body{padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));min-height:100dvh;gap:8px}header{max-width:760px;gap:6px}button,select{min-height:44px;touch-action:manipulation}#board{width:min(100%,calc(100dvh - 220px),760px);flex:none;touch-action:manipulation;user-select:none;-webkit-user-select:none;container-type:inline-size}.sq{min-height:0;min-width:0;touch-action:manipulation}.piece{font-size:clamp(10px,4cqw,32px);pointer-events:none}.dot{pointer-events:none}dialog{width:min(94vw,480px);max-height:85dvh;overflow:auto}dialog input{width:24px;height:24px;flex-shrink:0}dialog label{align-items:center}dialog button{margin:4px 0}button:focus-visible,select:focus-visible{outline:2px solid gold;outline-offset:-2px}
@media(max-width:600px) and (orientation:portrait){#board{width:100%;max-width:600px;border-width:3px}header{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}header select,header button{width:100%;font-size:14px}h1{font-size:20px}#status{font-size:15px}.piece{box-shadow:0 2px 0 #49301c,0 3px 4px #0006,inset 0 0 0 2px #ffffff20}}
@media(orientation:landscape) and (max-height:600px){body{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto 1fr;align-items:start;justify-items:center;gap:6px}h1{grid-column:1;grid-row:1}header{grid-column:1;grid-row:3;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}header button,header select{font-size:13px;min-width:0;width:100%}#status{grid-column:1;grid-row:2}#board{grid-column:2;grid-row:1/4;width:min(calc(100dvh - 24px),55vw);border-width:3px}}
.sq{min-height:0;display:block}.piece,.dot{position:absolute;left:50%;top:50%;translate:-50% -50%;height:auto;aspect-ratio:1;display:block}.piece{width:62%;height:62%;line-height:1;align-content:center;text-align:center}.dot{width:24%;height:24%}</style><h1>Tammi</h1><header><select id="mode"><option value="ai">Tietokonetta vastaan</option><option value="two">Kaksinpeli</option></select><select id="level"><option value="1">Helppo</option><option value="3" selected>Keskitaso</option><option value="5">Vaikea</option></select><button onclick="reset()">Uusi peli</button><button onclick="undo()">Peru</button><button onclick="full()">⛶ Koko näyttö</button><button onclick="rules.showModal()">Säännöt</button></header><dialog id="rules"><h2>Pelisäännöt</h2><label>Pelilauta <select id="size"><option>10</option><option>8</option><option>12</option></select></label><label>Lentävä tammi <input id="fly" type="checkbox" checked></label><label>Syönti taaksepäin <input id="back" type="checkbox" checked></label><label>Pakollinen syönti <input id="must" type="checkbox" checked></label><label>Enimmäissyönti <input id="max" type="checkbox" checked></label><label>Korotus <select id="promo"><option value="end">Vuoron lopussa</option><option value="now">Heti</option><option value="stop">Päättää vuoron</option></select></label><label>Syödyt poistetaan vasta lopussa <input id="late" type="checkbox" checked></label><button onclick="defaults()">Oletukset</button> <button onclick="saveRules()">Käytä ja aloita uusi peli</button> <button onclick="rules.close()">Sulje</button></dialog><div id="status"></div><div id="board"></div><script>
const $=id=>document.getElementById(id),board=$('board'),mode=$('mode'),level=$('level'),rules=$('rules');let N=10,R={fly:true,back:true,must:true,max:true,promo:'end',late:true},b,t,s,f,captured=[],history=[],timer,animation;
function defaults(){ $('size').value=10;for(const k of ['fly','back','must','max','late'])$(k).checked=true;$('promo').value='end'}
function saveRules(){N=+$('size').value;for(const k of ['fly','back','must','max','late'])R[k]=$(k).checked;R.promo=$('promo').value;rules.close();reset()}
function raw(a,p,i,cap,only){let out=[],king=Math.abs(a[i])===2,r=Math.floor(i/N),c=i%N;for(const dy of [-1,1])for(const dx of [-1,1]){let enemy=-1;for(let d=1;d<=(king&&R.fly?N:2);d++){let y=r+dy*d,x=c+dx*d;if(y<0||x<0||y>=N||x>=N)break;let j=y*N+x,v=a[j];if(R.late&&cap.includes(j))break;if(v){if(Math.sign(v)===p||enemy>=0||(!king&&!R.back&&dy!==-p)||(!(king&&R.fly)&&d!==1))break;enemy=j;continue}if(enemy>=0){out.push({i,j,k:enemy});if(!(king&&R.fly))break}else{if(!only&&(king||dy===-p)&&(d===1||king&&R.fly))out.push({i,j,k:-1});if(!(king&&R.fly))break}}}return out}
function step(a,m,cap){let n=a.slice(),p=Math.sign(n[m.i]),c=cap.slice();n[m.j]=n[m.i];n[m.i]=0;if(m.k>=0){c.push(m.k);if(!R.late)n[m.k]=0}let crown=Math.abs(n[m.j])===1&&(p===1?m.j<N:m.j>=N*(N-1));if(crown&&R.promo!=='end')n[m.j]*=2;let more=m.k>=0&&!(crown&&R.promo==='stop')&&raw(n,p,m.j,c,true).some(x=>x.k>=0);if(!more){if(R.late)c.forEach(k=>n[k]=0);if(crown)n[m.j]=2*p;c=[]}return {a:n,f:more?m.j:-1,c}}
function count(a,m,c){let z=step(a,m,c);return 1+(z.f<0?0:Math.max(...raw(z.a,Math.sign(z.a[z.f]),z.f,z.c,true).map(x=>count(z.a,x,z.c))))}
function moves(a,p,f=-1,c=[]){let ms=[];for(let i=0;i<a.length;i++)if(Math.sign(a[i])===p&&!c.includes(i)&&(f<0||f===i))ms.push(...raw(a,p,i,c,f>=0));let hits=ms.filter(m=>m.k>=0);if(hits.length&&R.max){let scores=hits.map(m=>count(a,m,c)),best=Math.max(...scores);hits=hits.filter((m,i)=>scores[i]===best)}return f>=0||R.must&&hits.length?hits:[...ms.filter(m=>m.k<0),...hits]}
function cancel(){clearTimeout(timer);if(animation){animation.cancel();animation=null}}
function reset(){cancel();board.style.gridTemplateColumns=board.style.gridTemplateRows=`repeat(${N},minmax(0,1fr))`;b=Array.from({length:N*N},(_,i)=>(Math.floor(i/N)+i%N)%2?(i<N*(N/2-1)?-1:i>=N*(N/2+1)?1:0):0);t=1;s=f=-1;captured=[];history=[];draw()}
function draw(){let ms=moves(b,t,f,captured);$('status').textContent=(!ms.length?(t===1?'Mustat':'Vaaleat')+' voittivat!':mode.value==='ai'&&t===-1?'Tietokoneen vuoro':f>=0?'Jatka syömistä':t===1?'Vaaleiden vuoro':'Mustien vuoro')+' · '+N+' × '+N;board.replaceChildren();b.forEach((v,i)=>{let el=document.createElement('button');el.className='sq '+(s===i?'selected':(Math.floor(i/N)+i%N)%2?'dark':'light');el.setAttribute('aria-label',`${String.fromCharCode(97+i%N)}${N-Math.floor(i/N)} ${v>0?'vaalea':v<0?'tumma':'tyhjä'}${Math.abs(v)===2?' tammi':''}`);el.onclick=()=>click(i);if(v){let p=document.createElement('span');p.className='piece '+(v>0?'white':'black')+(captured.includes(i)?' taken':'');p.textContent=Math.abs(v)===2?'♛':'';el.append(p)}else if(ms.some(m=>m.i===s&&m.j===i)){let d=document.createElement('span');d.className='dot';el.append(d)}board.append(el)})}
function click(i){if(mode.value==='ai'&&t===-1)return;let ms=moves(b,t,f,captured),m=ms.find(m=>m.i===s&&m.j===i);if(m){if(f<0)history.push({b:b.slice(),t});play(m)}else if(ms.some(m=>m.i===i)){s=i;draw()}}
function play(m){let z=step(b,m,captured);b=z.a;f=s=z.f;captured=z.c;if(f<0)t=-t;draw();if(mode.value==='ai'&&t===-1&&moves(b,t,f,captured).length)timer=setTimeout(ai,650)}
function score(a,c){return a.reduce((sum,v,i)=>sum+(c.includes(i)?0:(v<0?1:-1)*(Math.abs(v)===2?300:Math.abs(v)===1?100+(v<0?Math.floor(i/N):N-1-Math.floor(i/N))*3:0)),0)}
let nodes;function search(a,p,f,c,d,alpha,beta){if(++nodes>18000||d<=0&&f<0)return score(a,c);let ms=moves(a,p,f,c);if(!ms.length)return p===-1?-10000-d:10000+d;let best=p===-1?-Infinity:Infinity;for(let m of ms){let z=step(a,m,c),v=search(z.a,z.f>=0?p:-p,z.f,z.c,d-(z.f<0?1:0),alpha,beta);if(p===-1){best=Math.max(best,v);alpha=Math.max(alpha,best)}else{best=Math.min(best,v);beta=Math.min(beta,best)}if(beta<=alpha)break}return best}
function ai(){let ms=moves(b,-1,f,captured);if(!ms.length)return;let depth=+level.value,m=ms[0],best=-Infinity;for(let x of ms){nodes=0;let z=step(b,x,captured),v=search(z.a,z.f>=0?-1:1,z.f,z.c,depth-1,-Infinity,Infinity)+Math.random()*(depth===1?35:2);if(v>best){best=v;m=x}}let source=board.children[m.i],target=board.children[m.j],piece=source.querySelector('.piece'),a=source.getBoundingClientRect(),z=target.getBoundingClientRect();source.style.overflow='visible';source.style.zIndex=5;animation=piece.animate([{transform:'translate(0,0)'},{transform:`translate(${z.left-a.left}px,${z.top-a.top}px)`}],{duration:850,easing:'ease-in-out',fill:'forwards'});animation.onfinish=()=>{animation=null;play(m)}}
function undo(){cancel();let h=history.pop();if(h){b=h.b;t=h.t;s=f=-1;captured=[];draw()}}async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('Kokeile selaimen koko näytön toimintoa.')}}mode.onchange=reset;reset();</script></html>

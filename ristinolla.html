<!doctype html><html lang="fi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ristinolla</title><style>*{box-sizing:border-box}body{margin:0;background:#202520;color:#f5e5c3;font:16px system-ui;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}h1{margin:0;font-size:23px}a{color:inherit}header{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:800px}label{display:flex;align-items:center;gap:5px}button,select{font:inherit;min-height:44px;border:0;border-radius:7px;padding:8px;touch-action:manipulation}#viewport{max-width:100%;width:min(100%,760px);max-height:70dvh;overflow:auto;border:3px solid #795638;overscroll-behavior:contain}#grid{display:grid;gap:1px;background:#956440;width:max-content}.cell{padding:0;border-radius:0;min-height:0;width:var(--cell);height:var(--cell);background:#ead7b5;color:#57351e;font-size:calc(var(--cell)*.72);font-weight:700;line-height:1}.cell.o{color:#35625a}.cell.win{background:#a9d18b}.cell.last{box-shadow:inset 0 0 0 2px #b47728}#status{font-weight:bold}input{max-width:120px}@media(orientation:landscape) and (max-height:550px){body{display:grid;grid-template-columns: minmax(180px,1fr) 2fr;align-items:start}#viewport{grid-column:2;grid-row:1/5;max-height:94dvh}header{grid-column:1}#status{grid-column:1}}</style><h1><a href="index.html">‹ Pelit</a> · Ristinolla</h1><header><label>Kenttä <select id="size"></select></label><label>Suora <select id="length"></select></label><select id="mode"><option value="ai">Tietokonetta vastaan</option><option value="two">Kaksinpeli</option></select><select id="level"><option value="easy">Helppo</option><option value="normal" selected>Normaali</option><option value="hard">Vaikea</option></select><button id="new">Uusi peli</button><button id="undo">Peru</button><button id="full">⛶</button></header><label>Ruudun koko <input id="zoom" type="range" min="28" max="120" value="48"></label><div id="status" aria-live="polite"></div><div id="viewport"><div id="grid"></div></div><script>
const $=id=>document.getElementById(id);let n=3,k=3,b=[],turn=1,win=[],history=[],timer,done=false;const dirs=[[1,0],[0,1],[1,1],[1,-1]];for(let i=3;i<=40;i++)$('size').add(new Option(i+' × '+i,i));function lengths(){let old=+$('length').value||3;$('length').replaceChildren();for(let i=3;i<=Math.min(6,+$('size').value);i++)$('length').add(new Option(i,i));$('length').value=Math.min(old,+$('size').value)}lengths();function resize(){let v=$('viewport');let fit=Math.floor((v.clientWidth-4)/n);let z=Math.min(120,Math.max(28,fit));$('zoom').value=z;applyZoom()}function applyZoom(){$('grid').style.setProperty('--cell',$('zoom').value+'px')}function reset(){clearTimeout(timer);n=+$('size').value;k=+$('length').value;b=Array(n*n).fill(0);turn=1;win=[];history=[];done=false;$('grid').style.gridTemplateColumns=`repeat(${n},var(--cell))`;resize();draw()}
function line(i,p){let r=Math.floor(i/n),c=i%n;for(let [dy,dx] of dirs){let a=[i];for(let s of [-1,1])for(let d=1;d<n;d++){let y=r+dy*d*s,x=c+dx*d*s;if(y<0||x<0||y>=n||x>=n||b[y*n+x]!==p)break;a.push(y*n+x)}if(a.length>=k)return a}return []}
function draw(){$('status').textContent=win.length?(turn===1?'X':'O')+' voitti!':done?'Tasapeli':turn===-1&&$('mode').value==='ai'?'Tietokoneen vuoro':(turn===1?'X':'O')+' vuorossa';let g=$('grid');if(g.children.length!==b.length){g.replaceChildren();b.forEach((_,i)=>{let e=document.createElement('button');e.onclick=()=>{if(!done&&!(turn===-1&&$('mode').value==='ai'))play(i)};g.append(e)})}b.forEach((p,i)=>{let e=g.children[i];e.className='cell'+(p===-1?' o':'')+(win.includes(i)?' win':'')+(history.at(-1)===i?' last':'');e.textContent=p===1?'×':p===-1?'○':'';e.setAttribute('aria-label',`${Math.floor(i/n)+1}, ${i%n+1}: ${e.textContent||'tyhjä'}`)})}
function play(i){if(done||b[i])return;b[i]=turn;history.push(i);win=line(i,turn);done=!!win.length||history.length===b.length;if(!done)turn=-turn;draw();if(!done&&turn===-1&&$('mode').value==='ai')timer=setTimeout(ai,550)}
function potential(i,p){let r=Math.floor(i/n),c=i%n,total=0;for(let [dy,dx] of dirs)for(let start=1-k;start<=0;start++){let count=0,valid=true;for(let d=start;d<start+k;d++){let y=r+dy*d,x=c+dx*d;if(y<0||x<0||y>=n||x>=n||b[y*n+x]===-p){valid=false;break}if(b[y*n+x]===p)count++}if(valid)total+=Math.pow(5,count)}return total}
function ai(){if(done||turn!==-1)return;let empty=b.map((v,i)=>v? -1:i).filter(i=>i>=0),level=$('level').value;let wins=empty.filter(i=>line(i,-1).length),blocks=empty.filter(i=>line(i,1).length);if(wins.length)return play(wins[0]);if(level!=='easy'&&blocks.length)return play(blocks[0]);if(level==='easy'&&Math.random()<.65)return play(empty[Math.floor(Math.random()*empty.length)]);let best=-Infinity,choice=empty[0];for(let i of empty){let score=potential(i,-1)+potential(i,1)*(level==='hard'?1.1:.7)-.01*(Math.abs(i%n-(n-1)/2)+Math.abs(Math.floor(i/n)-(n-1)/2))+Math.random()*(level==='hard'?.1:3);if(score>best){best=score;choice=i}}play(choice)}
$('undo').onclick=()=>{clearTimeout(timer);if(!history.length)return;let i=history.pop(),p=b[i];b[i]=0;if($('mode').value==='ai'&&p===-1&&history.length){i=history.pop();p=b[i];b[i]=0}turn=p;win=[];done=false;draw()};$('size').onchange=()=>{lengths();reset()};$('length').onchange=$('mode').onchange=$('new').onclick=reset;$('zoom').oninput=applyZoom;$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}};window.addEventListener('resize',resize);reset();</script></html>
